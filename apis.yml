aid: quickbase

name: Quickbase

description: Quickbase is a no-code / low-code application platform for dynamic work and complex project management, letting business teams build
  custom apps on shared data to improve their processes. Developers can access Quickbase apps programmatically through the Quickbase JSON RESTful
  API (developer.quickbase.com, downloadable as OpenAPI), covering apps, tables, fields, reports, records, files, users, groups, audit and platform
  analytics, alongside the legacy XML/HTTP API.

